<!DOCTYPE html>
<html lang="pt-BR" class="conferindo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Rodrigo Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* A página fica invisível até a sessão ser conferida */
.conferindo body{visibility:hidden}

:root{
  --areia:#ecebe6;--branco:#fdfcfa;--oliva:#7a8450;--oliva-escuro:#5f6739;--oliva-suave:rgba(122,132,80,.13);
  --nude:#cdd0c2;--texto:#22272a;--suave:#4b524c;--apagado:#8a8f88;--linha:#d6d6ce;--linha-forte:#c4c6bb;
  --vermelho:#a8432f;--vermelho-fundo:#f6e3df;--amarelo:#8a6a12;--amarelo-fundo:#f7edcf;
  --fonte:"Jost",system-ui,sans-serif;--r-btn:4px;--r-campo:6px;--r-card:12px;--menu:224px
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--areia);color:var(--texto);font-family:var(--fonte);font-weight:300;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
b,strong{font-weight:500}
.svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- MENU LATERAL ---------- */
.menu{position:fixed;inset:0 auto 0 0;width:var(--menu);display:flex;flex-direction:column;background:var(--branco);border-right:1px solid var(--linha);z-index:30}
.menu-marca{padding:20px 20px 14px;font-size:11px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--texto)}
.menu-marca small{display:block;margin-top:2px;font-size:10px;letter-spacing:.18em;color:var(--oliva)}
.menu nav{flex:1;overflow-y:auto;padding:4px 12px}
.menu-grupo{margin:14px 8px 6px;font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--apagado)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:1px 0;border:0;border-radius:var(--r-campo);background:none;color:var(--suave);font-size:13.5px;text-align:left;text-decoration:none}
.menu-item:hover{background:rgba(34,39,42,.04);color:var(--texto)}
.menu-item.ativo{background:var(--oliva-suave);color:var(--oliva-escuro);font-weight:400}
.menu-pe{padding:14px 20px 18px;border-top:1px solid var(--linha);font-size:12px;color:var(--suave)}
.menu-pe .email{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.sair{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--linha);border-radius:var(--r-btn);background:none;font-size:12px;color:var(--suave)}
.sair:hover{border-color:var(--suave);color:var(--texto)}
.menu-fundo{display:none}

/* ---------- ÁREA DE CONTEÚDO ---------- */
.conteudo{margin-left:var(--menu);min-height:100vh;padding:20px 28px 60px}
.topo{display:flex;align-items:center;gap:12px;min-height:36px;margin-bottom:16px}
.topo h1{margin:0;font-size:16px;font-weight:400}
.topo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.abre-menu{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--linha);border-radius:var(--r-btn);background:var(--branco)}

/* ---------- PEÇAS COMUNS ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--linha-forte);border-radius:var(--r-btn);background:var(--branco);font-size:12.5px;color:var(--texto);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--suave)}
.btn--principal{background:var(--oliva);border-color:var(--oliva);color:var(--branco)}
.btn--principal:hover{background:var(--oliva-escuro);border-color:var(--oliva-escuro)}
.btn--perigo{color:var(--vermelho);border-color:#e3c0b7}
.btn--perigo:hover{border-color:var(--vermelho)}
.btn:disabled{opacity:.55;cursor:wait}
.icone-btn{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:var(--r-btn);background:none;color:var(--suave)}
.icone-btn:hover{background:rgba(34,39,42,.06);color:var(--texto)}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-card)}
.cartao-cabeca{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--linha)}
.cartao-cabeca h2{margin:0;font-size:13.5px;font-weight:400}
.cartao-cabeca .dica{font-size:12px;color:var(--apagado)}
.cartao-cabeca .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vazio{padding:22px 16px;color:var(--suave);font-size:13px;text-align:center}
.etiqueta-exemplo{display:inline-block;margin-left:6px;padding:1px 6px;border:1px dashed var(--linha-forte);border-radius:999px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);vertical-align:1px}

/* faixa de números fina e dividida */
.faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:16px;background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-card);overflow:hidden}
.faixa > div{padding:12px 16px;border-left:1px solid var(--linha);min-width:0}
.faixa > div:first-child{border-left:0}
.faixa span{display:block;font-size:11px;color:var(--apagado)}
.faixa strong{display:block;margin-top:2px;font-size:16px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faixa small{display:block;margin-top:1px;font-size:11px;color:var(--suave)}

/* avisos do topo */
#avisos:empty{display:none}
#avisos{margin-bottom:14px}
.alerta{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;padding:10px 12px;border:1px solid #ead9a8;border-radius:var(--r-campo);background:var(--amarelo-fundo);color:#5e4a10;font-size:12.5px}
.alerta--erro{border-color:#e9c4bb;background:var(--vermelho-fundo);color:#7a2c1f}

/* tabelas */
.rola{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;padding:8px 10px;border-bottom:1px solid var(--linha);background:var(--branco);font-size:11px;font-weight:400;color:var(--apagado);text-align:left;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #e7e7e0;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover td{background:#f6f6f1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.curto{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.apagado{color:var(--apagado)}
th.ordena{cursor:pointer;user-select:none}
th.ordena:hover{color:var(--texto)}
th .seta{display:inline-block;margin-left:4px;font-size:10px;opacity:.35}
th.ativo{color:var(--texto)}
th.ativo .seta{opacity:1;color:var(--oliva)}

/* pílulas de status */
.pilula{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:400;white-space:nowrap;line-height:1.6}
.pilula::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pilula--sem-ponto::before{display:none}

/* barra de ferramentas (busca, filtros) */
.ferramentas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--linha)}
.busca{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--linha-forte);border-radius:var(--r-btn);background:#fff;min-width:200px;flex:1;max-width:320px;color:var(--apagado)}
.busca input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;color:var(--texto)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:28px;padding:0 10px;border:1px solid var(--linha);border-radius:999px;background:none;font-size:12px;color:var(--suave)}
.chip:hover{border-color:var(--suave)}
.chip.ativo{background:var(--oliva-suave);border-color:transparent;color:var(--oliva-escuro);font-weight:400}
.chip small{margin-left:3px;color:var(--apagado)}

/* ---------- JANELA (formulários) ---------- */
.janela-fundo{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(34,39,42,.35)}
.janela{width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:var(--branco);border-radius:var(--r-card);box-shadow:0 18px 50px rgba(34,39,42,.22)}
.janela--larga{max-width:640px}
.janela-cabeca{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--branco);z-index:1}
.janela-cabeca h3{margin:0;font-size:14px;font-weight:400}
.janela-cabeca .icone-btn{margin-left:auto}
.janela-corpo{padding:16px}
.janela-pe{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--linha)}
.janela-pe .direita{margin-left:auto;display:flex;gap:8px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--suave)}
.campo--inteiro{grid-column:1/-1}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border:1px solid var(--linha-forte);border-radius:var(--r-campo);background:#fff;font-size:13.5px;color:var(--texto)}
.campo textarea{min-height:80px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,.busca:focus-within{outline:2px solid var(--oliva);outline-offset:-1px;border-color:var(--oliva)}
.campo small{color:var(--apagado);font-size:11.5px}
.campo--check{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--texto)}
.campo--check input{width:16px;height:16px;accent-color:var(--oliva)}
.erro-janela{margin:0 0 12px;padding:8px 10px;border-radius:var(--r-campo);background:var(--vermelho-fundo);color:#7a2c1f;font-size:12.5px}

/* mensagem rápida no canto */
.recado{position:fixed;right:16px;bottom:16px;z-index:80;max-width:340px;padding:10px 14px;border-radius:var(--r-campo);background:var(--texto);color:var(--areia);font-size:12.5px;box-shadow:0 8px 26px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
.recado.mostra{opacity:1;transform:none}
.recado--erro{background:var(--vermelho)}

/* ---------- PORTFÓLIO ---------- */
.grade-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grafico{position:relative;padding:16px 16px 10px}
.barras{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--linha)}
.barra{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.barra i{display:block;width:100%;max-width:26px;min-height:0;border-radius:4px 4px 0 0;background:var(--oliva)}
.barra:hover i{background:var(--oliva-escuro)}
.barra.hoje i{background:var(--oliva-escuro)}
.barra .dica-barra{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:var(--r-btn);background:var(--texto);color:var(--areia);font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.barra:hover .dica-barra{opacity:1}
.eixo{display:flex;gap:2px;margin-top:6px}
.eixo span{flex:1;text-align:center;font-size:10.5px;color:var(--apagado);font-variant-numeric:tabular-nums}
.grafico-max{position:absolute;top:10px;right:16px;font-size:11px;color:var(--apagado)}
.frase-vazia{display:flex;align-items:center;justify-content:center;min-height:150px;padding:16px;border:1px dashed var(--linha-forte);border-radius:var(--r-campo);color:var(--suave);font-size:13px;text-align:center}
.origens{list-style:none;margin:0;padding:8px 16px 14px}
.origens li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:7px 0;border-bottom:1px solid #ecece6;font-size:13px}
.origens li:last-child{border-bottom:0}
.origens .trilho{grid-column:1/-1;height:4px;border-radius:4px;background:#ecece6;overflow:hidden}
.origens .trilho i{display:block;height:100%;border-radius:4px;background:var(--oliva)}
.origens em{font-style:normal;color:var(--apagado);font-variant-numeric:tabular-nums}
.alca{display:inline-grid;place-items:center;width:24px;height:28px;border:0;background:none;color:var(--apagado);cursor:grab;touch-action:none}
.alca:hover{color:var(--texto)}
tr.arrastando td{background:var(--oliva-suave)!important}
tr.arrastando .alca{cursor:grabbing}
tr.escondido td:not(:last-child){opacity:.45}
.olho.desligado{color:var(--apagado)}

/* ---------- MARCAS ---------- */
.zap{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px;border:1px solid var(--linha);border-radius:999px;font-size:11px;color:var(--oliva-escuro);text-decoration:none;white-space:nowrap}
.zap:hover{border-color:var(--oliva)}
.arroba{color:var(--oliva-escuro);text-decoration:none}
.arroba:hover{text-decoration:underline}

/* ---------- CALENDÁRIO ---------- */
.cal-topo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--linha)}
.cal-mes{min-width:150px;font-size:14px;font-weight:400}
.cal-semana,.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-semana span{padding:8px 8px 6px;font-size:11px;color:var(--apagado);text-align:left;border-bottom:1px solid var(--linha)}
.cal-dia{position:relative;min-height:104px;padding:6px;border-right:1px solid #e7e7e0;border-bottom:1px solid #e7e7e0;cursor:pointer;min-width:0}
.cal-dia:nth-child(7n){border-right:0}
.cal-dia:hover{background:#f7f7f2}
.cal-dia.fora{background:#f4f4ef}
.cal-dia.fora .cal-num,.cal-dia.fora .cal-item{opacity:.45}
.cal-num{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:999px;font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.cal-dia.hoje{background:rgba(122,132,80,.06)}
.cal-dia.hoje .cal-num{background:var(--oliva);color:var(--branco);font-weight:400}
.cal-mais-dia{position:absolute;top:5px;right:5px;display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:var(--r-btn);background:var(--oliva-suave);color:var(--oliva-escuro);opacity:0;transition:opacity .15s}
.cal-dia:hover .cal-mais-dia,.cal-mais-dia:focus-visible{opacity:1}
.cal-itens{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.cal-item{display:flex;align-items:center;gap:5px;width:100%;padding:2px 5px;border:0;border-radius:var(--r-btn);background:var(--cor-fundo,#eee);color:var(--cor,#333);font-size:11.5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-item span{overflow:hidden;text-overflow:ellipsis}
.cal-item.feito span{text-decoration:line-through;opacity:.6}
.cal-item:hover{filter:brightness(.96)}
.cal-ver-mais{padding:1px 5px;border:0;background:none;font-size:11.5px;color:var(--suave);text-align:left}
.cal-ver-mais:hover{color:var(--texto);text-decoration:underline}
.legenda-cal{display:flex;flex-wrap:wrap;gap:12px;padding:10px 16px;font-size:11.5px;color:var(--suave)}
.legenda-cal i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px;vertical-align:0}
.lista-dia{list-style:none;margin:0;padding:0}
.lista-dia li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ecece6}
.lista-dia li:last-child{border-bottom:0}
.lista-dia .texto{flex:1;min-width:0}
.lista-dia .texto small{display:block;color:var(--apagado)}
.atrasados{list-style:none;margin:0;padding:4px 16px 10px}
.atrasados li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #ecece6}
.atrasados li:last-child{border-bottom:0}
.atrasados .texto{flex:1;min-width:160px}
.atrasados .texto small{display:block;color:var(--apagado)}

/* ---------- CAMPANHAS ---------- */
.estrela{display:inline-grid;place-items:center;width:26px;height:26px;border:0;border-radius:var(--r-btn);background:none;color:var(--linha-forte)}
.estrela:hover{color:var(--oliva)}
.estrela.ligada{color:#b8892f}
.estrela.ligada .svg{fill:currentColor}
tr.favorita td:first-child{box-shadow:inset 3px 0 0 var(--oliva)}
tr.favorita td{background:rgba(122,132,80,.045)}
.prazo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.aviso-prazo{padding:1px 7px;border-radius:999px;font-size:11px;white-space:nowrap}
.aviso-prazo--atrasado{background:var(--vermelho-fundo);color:var(--vermelho)}
.aviso-prazo--perto{background:var(--amarelo-fundo);color:var(--amarelo)}

/* ---------- CHECKLIST ---------- */
.sub-abas{display:flex;gap:2px;overflow-x:auto;margin-bottom:16px;padding:3px;background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-campo)}
.sub-aba{flex:1 0 auto;padding:7px 12px;border:0;border-radius:var(--r-btn);background:none;font-size:12.5px;color:var(--suave);white-space:nowrap}
.sub-aba:hover{color:var(--texto)}
.sub-aba.ativo{background:var(--oliva-suave);color:var(--oliva-escuro);font-weight:400}
.progresso{height:6px;border-radius:6px;background:#e7e7e0;overflow:hidden}
.progresso i{display:block;height:100%;border-radius:6px;background:var(--oliva);transition:width .3s}
.geral{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px}
.geral .progresso{flex:1}
.geral strong{font-weight:400;font-size:13.5px;white-space:nowrap}
.secao{margin-bottom:10px;overflow:hidden}
.secao summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none}
.secao summary::-webkit-details-marker{display:none}
.secao summary .emoji{font-size:18px}
.secao summary .nome{flex:1;min-width:0}
.secao summary .nome b{display:block;font-weight:400;font-size:13.5px}
.secao summary .nome small{display:block;color:var(--apagado);font-size:12px}
.secao summary .lado{display:flex;align-items:center;gap:10px;width:150px;font-size:11.5px;color:var(--suave)}
.secao summary .lado .progresso{flex:1}
.secao summary .gira{transition:transform .2s;color:var(--apagado)}
.secao[open] summary .gira{transform:rotate(90deg)}
.secao-corpo{padding:0 16px 14px}
.porque{margin:0 0 10px;padding:10px 12px;border-radius:var(--r-campo);background:#f4f4ef;color:var(--suave);font-size:13px}
.porque b{color:var(--texto)}
.itens{list-style:none;margin:0;padding:0}
.itens li{border-top:1px solid #ecece6}
.itens label{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;cursor:pointer}
.itens input{margin-top:3px;width:16px;height:16px;accent-color:var(--oliva);flex-shrink:0}
.itens .t{display:block;font-size:13.5px}
.itens .d{display:block;margin-top:1px;font-size:12.5px;color:var(--apagado)}
.itens input:checked + span .t{color:var(--apagado);text-decoration:line-through}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.ref{display:flex;flex-direction:column;padding:0;border:1px solid var(--linha);border-radius:var(--r-card);background:var(--branco);overflow:hidden;text-align:left}
.ref:hover{border-color:var(--suave)}
.ref-capa{position:relative;display:grid;place-items:center;aspect-ratio:9/14;background:var(--capa,#cdd0c2);font-size:40px}
.ref-capa .dur{position:absolute;right:8px;bottom:8px;padding:1px 7px;border-radius:999px;background:rgba(34,39,42,.6);color:#fff;font-size:11px}
.ref-info{padding:10px 12px 12px}
.ref-info b{display:block;font-weight:400;font-size:13px}
.ref-info small{display:block;margin-top:2px;color:var(--apagado);font-size:11.5px}
.ficha h4{margin:16px 0 6px;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--oliva-escuro)}
.ficha h4:first-child{margin-top:0}
.ficha p{margin:0;font-size:13.5px}
.ficha .gancho{padding:10px 12px;border-left:3px solid var(--oliva);background:#f4f4ef;border-radius:0 var(--r-campo) var(--r-campo) 0}
.blocos{list-style:none;margin:0;padding:0}
.blocos li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:8px 0;border-top:1px solid #ecece6;font-size:13px}
.blocos li:first-child{border-top:0}
.blocos .tempo{font-size:11.5px;color:var(--oliva-escuro);font-variant-numeric:tabular-nums;padding-top:1px}
.blocos em{color:var(--suave)}
.erros{margin:0;padding-left:18px;font-size:13px;color:var(--suave)}
.ideias{list-style:none;margin:0;padding:0}
.ideias li{padding:9px 0;border-top:1px solid #ecece6}
.ideias li:first-child{border-top:0}
.ideias b{display:block;font-weight:400;font-size:13.5px}
.ideias q{display:block;margin-top:2px;font-size:12.5px;color:var(--suave);quotes:"\201C" "\201D"}
.revisar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.revisar textarea{width:100%;min-height:420px;padding:12px;border:1px solid var(--linha-forte);border-radius:var(--r-campo);background:#fff;font-size:13.5px;line-height:1.6;resize:vertical}
.revisar textarea:focus{outline:2px solid var(--oliva);outline-offset:-1px}
.como-usar{margin:0 0 14px;padding:12px 16px}
.como-usar h3{margin:0 0 6px;font-size:13px;font-weight:400}
.como-usar ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--suave)}

/* ---------- CELULAR ---------- */
@media (max-width:900px){
  .grade-2,.revisar{grid-template-columns:1fr}
}
@media (max-width:760px){
  .menu{transform:translateX(-100%);transition:transform .25s;box-shadow:none}
  body.menu-aberto .menu{transform:none;box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.menu-aberto .menu-fundo{display:block;position:fixed;inset:0;z-index:25;background:rgba(34,39,42,.3)}
  .conteudo{margin-left:0;padding:12px 14px 50px}
  .abre-menu{display:inline-flex}
  .topo{flex-wrap:wrap}
  .faixa{grid-template-columns:1fr 1fr}
  .faixa > div{border-left:0;border-top:1px solid var(--linha)}
  .faixa > div:nth-child(-n+2){border-top:0}
  .faixa > div:nth-child(even){border-left:1px solid var(--linha)}
  .campos{grid-template-columns:1fr}
  .busca{max-width:none;min-width:0;flex-basis:100%}
  .cal-dia{min-height:64px;padding:3px}
  .cal-item{padding:1px 3px;font-size:10px}
  .cal-item .svg{display:none}
  .cal-semana span{padding:6px 4px;font-size:10px}
  .secao summary .lado{width:80px}
  .secao summary .lado span{display:none}
  .blocos li{grid-template-columns:1fr;gap:2px}
}
@media (max-width:480px){
  .cal-item span{display:none}
  .cal-item{height:6px;padding:0;border-radius:3px;background:var(--cor)}
  .cal-mais-dia{display:none}
}
</style>
</head>
